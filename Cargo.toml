[package]
name = "av-contrib"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Contributor-side byte and media access-unit helpers for av-mesh"
repository = "https://github.com/wavey-ai/av-contrib"
readme = "README.md"

[features]
default = ["srt-ingest"]
media_capability_enforce_publish_v1 = []
quadra-renditions = ["dep:av-traits", "dep:xcoder-quadra"]
rist-rs-tools = ["dep:rist-core-pure", "dep:rist-mio-pure"]
srt-ingest = ["av-upload-response/srt"]

[[bin]]
name = "rist-send"
path = "src/bin/rist-send.rs"
required-features = ["rist-rs-tools"]

[dependencies]
access-unit = "0.1.3"
anyhow = "1.0"
arc-swap = "1.7"
async-trait = "0.1"
boxer = { package = "wavey-boxer", version = "0.1.0" }
bytes = "1.9"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
form_urlencoded = "1.2"
futures-util = "0.3"
frame-header = "0.2.2"
h3 = "0.0.8"
h3-quinn = { version = "0.0.10", features = ["datagram"] }
h264 = { package = "wavey-h264", version = "0.1.1" }
av-hls = "0.1.0"
http = "1"
libc = "0.2"
mpeg2ts-reader = { package = "wavey-mpeg2ts-reader", version = "0.1.0" }
media-object = "0.1.1"
media-capability = "0.1.1"
music-audio-session = "0.1.2"
playlists = { git = "https://github.com/wavey-ai/playlists.git", rev = "4023d2e0761e876c6b92c6580550e3e2daa9b962", features = ["compact-object"] }
raptorq-datagram-fec = "0.1.6"
raptorq-fec-transport = "0.1.4"
raptorq = "2.0.1"
relay-session = "0.1.1"
rist-core-pure = { package = "rist-core", git = "https://github.com/wavey-ai/rist-rs.git", rev = "614c10ab03fb37e25b7d892a2224caaddcbb89a6", optional = true }
rist-mio-pure = { package = "rist-mio", git = "https://github.com/wavey-ai/rist-rs.git", rev = "614c10ab03fb37e25b7d892a2224caaddcbb89a6", optional = true }
rtmp-ingress = "0.1.1"
rustls = { version = "0.23.40", default-features = false, features = ["logging", "ring", "std"] }
rustls-pemfile = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.6"
soundkit-flac = { version = "0.12.3", default-features = false, features = ["packet-codec"] }
# SoundKit's native CELT codec with Opus Custom modes (1, 1.33 and 1.5 ms
# frames), from the branch `opus-custom-1ms` until a release has it. The
# crates.io soundkit-opus 0.12.3 wrapped libopus-rs and had no custom modes.
# soundkit-flac stays on crates.io: the repository's 0.13 has no
# `packet-codec` feature.
soundkit = { git = "https://github.com/wavey-ai/soundkit.git", branch = "opus-custom-1ms" }
soundkit-opus = { git = "https://github.com/wavey-ai/soundkit.git", branch = "opus-custom-1ms" }
synchronized-stems-media = "0.1.1"
tokio = { version = "1.45", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
talkback-media = "0.1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webpki-roots = "1"
# xxh3 for the identity digests and window digests (A 2.4, 2.6): the
# version playlists already locks.
xxhash-rust = { version = "0.8.17", features = ["xxh3"] }
av-upload-response = { git = "https://github.com/wavey-ai/web-services.git", rev = "066bf4b3296ea8403e1c310b86f189dde20e990e", default-features = false, features = ["rist-pure"] }
av-web-service = { git = "https://github.com/wavey-ai/web-services.git", rev = "066bf4b3296ea8403e1c310b86f189dde20e990e" }

[target.'cfg(target_os = "linux")'.dependencies]
av-traits = { git = "https://github.com/wavey-ai/av-rs.git", rev = "fe1342454a6aad796066fd18268b2a06edec2d4d", optional = true }
xcoder-quadra = { git = "https://github.com/wavey-ai/av-rs.git", rev = "fe1342454a6aad796066fd18268b2a06edec2d4d", optional = true }

[dev-dependencies]
ed25519-dalek = "2.2"

[patch.crates-io]
# The packet sequence tracker of 0.1.6 grows without limit after the first
# lost or reordered datagram of a flow. The fix is on the branch
# `bounded-sequence-tracker` of raptor-fec until a release has it.
raptorq-datagram-fec = { git = "https://github.com/wavey-ai/raptor-fec.git", rev = "68a1840acd6158111738253a1ae71f54642d1ac3" }
# wavey-boxer 0.1.0 drops the first two bytes of every RTMP AAC frame. The
# fix is 0.1.1 on the branch `fix-rtmp-aac-frame-start` of boxer, which is
# not published.
wavey-boxer = { git = "https://github.com/wavey-ai/boxer.git", rev = "ee90c8fe4cdb5e15c462f4532348e59e53bbe06e" }
# playlists takes access-unit from git (default branch, no rev), so its
# `Fmp4` would be a different type from the crates.io 0.1.3 that av-contrib,
# boxer, rtmp-ingress and soundkit-flac use. Cargo refuses a patch of a git
# source to the same repository at a rev, so playlists' dependency is pinned
# to the crates.io release instead: one package, versioned and checksummed.
[patch."https://github.com/wavey-ai/access-unit.git"]
access-unit = "=0.1.3"
